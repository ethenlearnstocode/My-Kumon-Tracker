<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumon Student Progress Tracker</title>
    <style>
        :root {
            --kumon-blue: #00a0e9;
            --kumon-dark: #0077b6;
            --bg: #eef7fc;
            --card: #ffffff;
            --border: #cbd5e1;
            --text: #1e293b;
            --muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 20px; }
        header { text-align: center; background: var(--card); padding: 20px; border-radius: 14px; border: 2px solid var(--kumon-blue); }
        h1 { color: var(--kumon-blue); font-size: 2.5rem; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        
        h2 { color: var(--kumon-dark); font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .btn { padding: 8px 14px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; color: white; }
        .btn-blue { background: var(--kumon-blue); }
        .btn-dark { background: var(--kumon-dark); }
        .btn-green { background: var(--success); }
        .btn-red { background: var(--danger); }
        .btn:hover { opacity: 0.9; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.85rem; font-weight: bold; color: var(--kumon-dark); }
        input, select { padding: 9px; border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; font-size: 0.95rem; }

        .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
        .day-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
        .day-title { font-weight: bold; color: var(--kumon-blue); border-bottom: 2px solid var(--kumon-blue); padding-bottom: 4px; margin-bottom: 10px; }
        
        .paper-item { background: white; border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .paper-item.done { background: #f0fdf4; border-color: var(--success); }
        .checkbox-btn { width: 20px; height: 20px; accent-color: var(--kumon-blue); cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        th { color: var(--muted); text-transform: uppercase; font-size: 0.8rem; }

        .history-item { background: #f8fafc; border-left: 4px solid var(--kumon-blue); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>kumon</h1>
            <p style="color: var(--muted);">Weekly Study Plan & Progress Tracker</p>
        </header>

        <div class="card">
            <h2>
                <span>Add Booklet for This Week</span>
                <div class="btn-group">
                    <button type="button" class="btn btn-dark" onclick="exportData()">📥 Export Data</button>
                    <button type="button" class="btn btn-dark" onclick="document.getElementById('fileInput').click()">📤 Import Data</button>
                    <input type="file" id="fileInput" style="display:none" onchange="importData(event)" accept=".json">
                    <button type="button" class="btn btn-red" onclick="resetAll()">⚠️ Reset All Data</button>
                </div>
            </h2>
            <form id="paperForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Booklet #</label>
                        <input type="text" id="bNo" placeholder="e.g. 3A 11" required>
                    </div>
                    <div class="form-group">
                        <label>Total Pages</label>
                        <input type="number" id="bPages" placeholder="10" required min="1" value="10">
                    </div>
                    <div class="form-group">
                        <label>Target Mins</label>
                        <input type="number" id="bTarget" placeholder="15" required min="1" value="15">
                    </div>
                    <div class="form-group">
                        <label>Actual Mins</label>
                        <input type="number" id="bActual" placeholder="15" required min="1" value="15">
                    </div>
                    <div class="form-group">
                        <label>Corrections</label>
                        <input type="number" id="bCorr" placeholder="0" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label>Assigned Day</label>
                        <select id="bDay">
                            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
                            <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-blue" style="width: 100%; padding: 12px;">+ Add Booklet to Schedule</button>
            </form>
        </div>
